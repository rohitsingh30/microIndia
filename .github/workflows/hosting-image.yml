name: Hosted snapshot image

# Builds ghcr.io/rohitsingh30/microindia-web: the dashboard + read-only API + the latest database
# snapshot (release asset "snapshot-latest", uploaded by deploy/publish_snapshot.sh). Nikamma runs it
# at https://microindia.nikamma.in from the digest pinned in its apps/microindia manifests.

on:
  workflow_dispatch:
  push:
    branches: [hosting]

permissions:
  contents: read
  packages: write

concurrency:
  group: hosting-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/rohitsingh30/microindia-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm ci --no-audit --no-fund && npm run build

      - name: Fetch database snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deploy/out
          gh release download snapshot-latest --pattern microindia-snapshot.sqlite3.gz --dir deploy/out
          ls -la deploy/out

      - name: Build image (linux/amd64)
        run: docker build --platform linux/amd64 -f deploy/Dockerfile -t "$IMAGE:${GITHUB_SHA}" .

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE:${GITHUB_SHA}"
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8080/ && break; sleep 2; done
          curl -fs http://127.0.0.1:8080/ | grep -qi '<html'
          # The creator index builds on the first data request (about a minute on a full snapshot).
          curl -fs --max-time 240 "http://127.0.0.1:8080/api/creators?limit=3" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("total", 0) > 0, d; print("creators", d["total"])'
          curl -fs --max-time 120 http://127.0.0.1:8080/api/summary | python3 -c 'import json,sys; print("summary keys", len(json.load(sys.stdin)))'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/actions/seed -d '{}')
          test "$code" = "403" || { echo "write not refused: $code"; exit 1; }
          docker logs smoke | tail -20
          docker rm -f smoke

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${GITHUB_SHA}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${GITHUB_SHA}")
          echo "Image: $digest" | tee -a "$GITHUB_STEP_SUMMARY"
